[workspace]
members = [
    "crates/config",
    "crates/rules",
    "crates/notifier",
    "crates/poller",
    "crates/cli",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/Tx-wats/core"
homepage = "https://github.com/Tx-wats/core"
readme = "README.md"
keywords = ["stellar", "soroban", "monitoring", "webhook", "blockchain"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[workspace.dependencies]
# Libraries opt into the tokio features they need; only the binary uses "full".
tokio      = { version = "1", default-features = false }
reqwest    = { version = "0.13", features = ["json"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2", features = ["derive"] }
futures = "0.3"
toml       = "1.1"
clap       = { version = "4", features = ["derive"] }
anyhow     = "1"
chrono     = { version = "0.4", features = ["serde"] }
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac               = "0.13"
sha2               = "0.11"
hex                = "0.4"

# Shared dev-dependencies
wiremock           = "0.6"
