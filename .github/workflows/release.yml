name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Multi-platform binaries ────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  archive: tar.gz }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, archive: tar.gz, cross: true }
          - { os: macos-latest,   target: aarch64-apple-darwin,      archive: tar.gz }
          - { os: macos-13,       target: x86_64-apple-darwin,       archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    archive: zip }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked -p txwatch --target ${{ matrix.target }}
          else
            cargo build --release --locked -p txwatch --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          name="txwatch-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          bin="target/${{ matrix.target }}/release/txwatch"
          [ "${{ matrix.archive }}" = "zip" ] && bin="${bin}.exe"
          cp "$bin" README.md LICENSE CHANGELOG.md "$name/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: txwatch-${{ matrix.target }}
          path: txwatch-*.${{ matrix.archive }}

  # ── Shell completions and man page ─────────────────────────────────────────
  # Generated once from a host build: the cross-compiled targets can't run
  # their own binary on the build machine.
  extras:
    name: Completions and man page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate
        shell: bash
        run: |
          cargo build --release --locked -p txwatch
          bin=target/release/txwatch
          name="txwatch-${GITHUB_REF_NAME}-completions-and-man"
          mkdir -p "$name/completions"
          "$bin" man > "$name/txwatch.1"
          for shell in bash zsh fish powershell elvish; do
            "$bin" completions "$shell" > "$name/completions/txwatch.$shell"
          done
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: txwatch-completions-and-man
          path: txwatch-*.tar.gz

  # ── GitHub Release with checksums ──────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build, extras]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum txwatch-* > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # ── Multi-arch Docker image on GHCR ────────────────────────────────────────
  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/txwatch
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
