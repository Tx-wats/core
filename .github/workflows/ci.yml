name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  config-schema:
    name: Config schema is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate and compare config schema
        run: |
          cargo run --quiet -p txwatch -- schema > /tmp/txwatch-config.schema.json
          jq -e '.properties.poll_interval_seconds and .properties.contracts and ."$defs".WatchedContract and ."$defs".RuleConfig and ."$defs".RuleEntry' /tmp/txwatch-config.schema.json
          jq -e '.properties.poll_interval_seconds and .properties.contracts and .definitions.WatchedContract and .definitions.AlertRule' docs/txwatch-config.schema.json
          test "$(jq -r '.properties.contracts.items."$ref"' /tmp/txwatch-config.schema.json)" = "#/$defs/WatchedContract"

  # ── Format ──────────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ── Clippy ──────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run all tests
        run: cargo test --all

      # Feature-gated code (e.g. the poller's `metrics` module) only compiles
      # and runs its tests with the feature on.
      - name: Run all tests with all features
        run: cargo test --all --all-features

  # ── Feature combinations ────────────────────────────────────────────────────
  features:
    name: Feature powerset (cargo-hack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Check every feature combination
        run: cargo hack check --workspace --feature-powerset --no-dev-deps

  # ── MSRV ────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.88

      - name: Check workspace builds on the MSRV
        run: cargo check --workspace --all-targets --locked

  # ── Publish dry-run ─────────────────────────────────────────────────────────
  publish-dry-run:
    name: cargo publish --dry-run (libraries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Package and verify each library crate
        run: >
          cargo publish --dry-run --locked --workspace
          --exclude txwatch

  # ── Dependency checks ───────────────────────────────────────────────────────
  # cargo-deny covers security advisories (RustSec) as well as licenses, bans
  # and sources, so a separate cargo-audit job is not needed.
  deny:
    name: Dependency checks (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # v1 bundles a Cargo too old to parse lockfile version 4, so it failed
      # before checking anything.
      - name: Run cargo-deny to check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2

  # ── Markdown link check ─────────────────────────────────────────────────────
  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # Placeholder hosts used in examples and local dev URLs aren't real links.
          args: >-
            --no-progress
            --exclude-path target
            --exclude '^https?://(localhost|127\.0\.0\.1|webhook)(:[0-9]+)?'
            --exclude 'hooks\.example\.com'
            --exclude 'friendbot\.stellar\.org'
            './**/*.md'

  # ── Docker image ────────────────────────────────────────────────────────────
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build --tag txwatch:ci .

      - name: Smoke-test the image
        run: docker run --rm txwatch:ci --version

  # ── Build (release) ─────────────────────────────────────────────────────────
  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, msrv, deny]
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binary
        run: cargo build --release -p txwatch

      - name: Upload txwatch binary
        uses: actions/upload-artifact@v4
        with:
          name: txwatch-linux-x86_64
          path: target/release/txwatch
          retention-days: 7
