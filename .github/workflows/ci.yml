name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  config-schema:
    name: Config schema is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate and compare config schema
        run: |
          cargo run --quiet -p txwatch -- schema > /tmp/txwatch-config.schema.json
          jq -S . /tmp/txwatch-config.schema.json > /tmp/txwatch-config.schema.sorted.json
          jq -S . docs/txwatch-config.schema.json > /tmp/txwatch-config.committed.sorted.json
          diff -u /tmp/txwatch-config.committed.sorted.json /tmp/txwatch-config.schema.sorted.json

  # ── Workflow lint ───────────────────────────────────────────────────────────
  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

  # ── Monitoring assets ───────────────────────────────────────────────────────
  promtool:
    name: Prometheus rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check alerting rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/rules:ro" --entrypoint promtool \
            prom/prometheus:v3.5.0 check rules /rules/txwatch-alerts.yml
      - name: Check Grafana dashboard is valid JSON
        run: jq -e '.panels | length > 0' deploy/grafana/txwatch.json

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/txwatch
      - run: helm template txwatch deploy/helm/txwatch --set metrics.serviceMonitor.enabled=true --set metrics.prometheusRule.enabled=true > /dev/null

  # ── Fuzz smoke test ─────────────────────────────────────────────────────────
  fuzz:
    name: Fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run each target for 30 seconds
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" -- -max_total_time=30
          done

  # ── Format ──────────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ── Clippy ──────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Docs ────────────────────────────────────────────────────────────────────
  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-

      - name: Build docs and deny warnings
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run all tests
        run: cargo test --all

      # Feature-gated code (e.g. the poller's `metrics` module) only compiles
      # and runs its tests with the feature on.
      - name: Run all tests with all features
        run: cargo test --all --all-features

  # ── Feature combinations ────────────────────────────────────────────────────
  features:
    name: Feature powerset (cargo-hack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Check every feature combination
        run: cargo hack check --workspace --feature-powerset --no-dev-deps --include-features soroban-xdr

  # ── MSRV ────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Read the MSRV from Cargo.toml so the job name and toolchain cannot drift.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].rust_version')
          echo "toolchain=$msrv" >> "$GITHUB_OUTPUT"
          echo "MSRV is $msrv"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.toolchain }}

      - name: Check workspace builds on the MSRV
        run: cargo check --workspace --all-targets --locked

  # ── Publish dry-run ─────────────────────────────────────────────────────────
  publish-dry-run:
    name: cargo publish --dry-run (libraries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Package and verify each library crate
        run: >
          cargo publish --dry-run --locked --workspace
          --exclude txwatch

  # ── Dependency checks ───────────────────────────────────────────────────────
  # cargo-deny covers security advisories (RustSec) as well as licenses, bans
  # and sources, so a separate cargo-audit job is not needed.
  deny:
    name: Dependency checks (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # v1 bundles a Cargo too old to parse lockfile version 4, so it failed
      # before checking anything.
      - name: Run cargo-deny to check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2

  # ── Markdown link check ─────────────────────────────────────────────────────
  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # Placeholder hosts used in examples and local dev URLs aren't real links.
          args: >-
            --no-progress
            --exclude-path target
            --exclude '^https?://(localhost|127\.0\.0\.1|webhook)(:[0-9]+)?'
            --exclude 'hooks\.example\.com'
            --exclude 'friendbot\.stellar\.org'
            './**/*.md'

  # ── Docker image ────────────────────────────────────────────────────────────
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: |
          docker build \
            --build-arg TXWATCH_GIT_SHA="$(git rev-parse --short HEAD)" \
            --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            --tag txwatch:ci .

      - name: Smoke-test the image
        run: |
          docker run --rm txwatch:ci --version
          if docker run --rm txwatch:ci --version | grep -q unknown; then
            echo "::error::txwatch --version reports an unknown git SHA"
            exit 1
          fi

  # ── End-to-end against a real Horizon/RPC ───────────────────────────────────
  e2e-quickstart:
    name: E2E (stellar/quickstart --local)
    runs-on: ubuntu-latest
    services:
      stellar:
        image: stellar/quickstart:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -sf http://localhost:8000/friendbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      - name: Install stellar-cli
        uses: taiki-e/install-action@v2
        with:
          tool: stellar-cli

      - name: Build txwatch
        run: cargo build -p txwatch

      - name: Run end-to-end scenario
        env:
          HORIZON_URL: http://localhost:8000
          RPC_URL: http://localhost:8000/soroban/rpc
          NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
        run: ./scripts/e2e-quickstart.sh

  # ── Build (release) ─────────────────────────────────────────────────────────
  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, msrv, deny]
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binary
        run: cargo build --release -p txwatch

      - name: Upload txwatch binary
        uses: actions/upload-artifact@v7
        with:
          name: txwatch-linux-x86_64
          path: target/release/txwatch
          retention-days: 7
