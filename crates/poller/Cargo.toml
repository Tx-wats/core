[package]
name    = "txwatch-poller"
version = "0.1.0"
edition = "2021"
license.workspace = true
rust-version.workspace = true
description = "Horizon polling engine for TxWatch Soroban contract monitoring"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Enable Prometheus metrics counters and optional /metrics HTTP endpoint.
metrics = ["dep:prometheus", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]

[dependencies]
txwatch-config   = { path = "../config", version = "0.1.0" }
txwatch-rules    = { path = "../rules", version = "0.1.0" }
txwatch-notifier = { path = "../notifier", version = "0.1.0" }
reqwest          = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
tokio            = { workspace = true, features = ["rt", "time", "sync", "macros", "net"] }
anyhow           = { workspace = true }
tracing          = { workspace = true }
chrono           = { workspace = true }
futures          = { workspace = true }
prometheus       = { version = "0.14", optional = true }
hyper            = { version = "1", features = ["http1", "server"], optional = true }
hyper-util       = { version = "0.1", features = ["tokio"], optional = true }
http-body-util   = { version = "0.1", optional = true }

[dev-dependencies]
wiremock         = { workspace = true }
tokio            = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true }
