[package]
name    = "txwatch-rules"
version = "0.1.0"
edition = "2021"
license.workspace = true
rust-version.workspace = true
description = "Alert rule evaluation and payload construction for TxWatch"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Enables decoding of Soroban envelope_xdr / result_xdr via the stellar-xdr crate.
soroban-xdr = ["dep:stellar-xdr"]

[dependencies]
txwatch-config = { path = "../config", version = "0.1.0" }
serde          = { workspace = true }
serde_json     = { workspace = true }
anyhow         = { workspace = true }
chrono         = { workspace = true }
tracing        = { workspace = true }
# Used by production code for commitment hashing and alert-id derivation, not
# only by tests.
sha2           = { workspace = true }
hex            = { workspace = true }
# Backs the `soroban-xdr` feature. It has to be a real optional dependency
# rather than a dev-dependency, because a dev-dependency cannot be optional and
# the feature references it with `dep:`.
stellar-xdr    = { version = "26", optional = true, default-features = false, features = ["std", "curr"] }

[dev-dependencies]
proptest   = "1"
tokio      = { workspace = true, features = ["macros", "rt"] }
criterion  = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "evaluate"
harness = false
